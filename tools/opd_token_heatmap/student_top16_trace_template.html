<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepMath · Student Top-16 Trace Diagnostic</title>
  <style>
    :root { color-scheme: light dark; --bg:light-dark(#f7f8fa,#0d1016); --surface:light-dark(#fff,#151a23); --soft:light-dark(#f0f3f7,#1d2430); --text:light-dark(#18202b,#edf2f7); --muted:light-dark(#657184,#a7b1c0); --border:light-dark(#d9dee7,#303948); --negative:light-dark(#b84675,#ff86b2); --heat1:light-dark(hsl(190 32% 88%),hsl(190 32% 22%)); --heat2:light-dark(hsl(202 46% 82%),hsl(202 46% 28%)); --heat3:light-dark(hsl(218 60% 76%),hsl(218 60% 34%)); --heat4:light-dark(hsl(245 74% 70%),hsl(245 74% 40%)); --heat5:light-dark(hsl(285 88% 64%),hsl(285 88% 44%)); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text)} main{width:min(1180px,calc(100% - 32px));margin:auto;padding:32px 0 48px} h1{margin:0;font-size:clamp(24px,4vw,36px);letter-spacing:-.03em} .subtitle{color:var(--muted);margin:8px 0 24px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 10px 30px light-dark(rgba(20,35,60,.08),rgba(0,0,0,.28))}.controls{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:14px;padding:18px}.field{display:grid;gap:7px;min-width:0}.wide{grid-column:1/-1}label,.label{font-size:13px;color:var(--muted);font-weight:600}select,input,button{font:inherit;color:var(--text)}select,input[type=search],button{background:var(--soft);border:1px solid var(--border);border-radius:9px;padding:9px 11px}select,input[type=search]{width:100%}input[type=range]{width:100%;accent-color:#5274ff}.position{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center}.legend{display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:14px 0}.swatch{width:32px;height:19px;border-radius:4px;display:grid;place-items:center;color:var(--text)}.l1{background:var(--heat1)}.l2{background:var(--heat2)}.l3{background:var(--heat3)}.l4{background:var(--heat4)}.l5{background:var(--heat5)}.summary{padding:14px;margin-bottom:12px;display:grid;gap:7px}.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{margin:3px 0;overflow-wrap:anywhere}.viewer{padding:18px}.stream{min-height:240px;max-height:520px;overflow-y:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;line-height:1.9}.token{border-radius:2px;cursor:default}.token.neg{text-decoration:underline dotted var(--negative) 2px}.detail{min-height:24px;color:var(--muted);font-size:13px;margin:14px 0 0}.status{color:var(--muted);font-size:13px;margin-bottom:8px}@media(max-width:720px){main{width:min(100% - 20px,1180px);padding-top:20px}.controls{grid-template-columns:1fr}.wide{grid-column:auto}.answer-grid{grid-template-columns:1fr}.position{grid-template-columns:1fr 1fr}.position input{grid-column:1/-1;grid-row:1}}
  </style>
</head>
<body><main>
  <h1>Student Top-16 · 逐 Token Logits 差异</h1>
  <p class="subtitle">Qwen3-1.7B 推理轨迹 · Student Top-16 support 与冻结 Qwen3-14B 对比</p>
  <section class="panel controls">
    <label class="field">搜索题目<input id="search" type="search" placeholder="题号 / Topic / 难度"></label>
    <label class="field">题目<select id="case"></select></label>
    <label class="field">指标<select id="metric"><option value="top16kl">Student Top-16 KL(S‖T)</option><option value="k1">采样 Token · log pS − log pT</option><option value="k3">采样 Token · K3</option><option value="overlap">Student/Teacher Top-16 overlap</option></select></label>
    <div class="field wide"><span id="window-label" class="label">Token window</span><div class="position"><button id="prev">上一段</button><input id="position" type="range" min="0" max="0" step="512" value="0"><button id="next">下一段</button></div></div>
  </section>
  <div class="legend"><span>差异低</span><span class="swatch l1">1</span><span class="swatch l2">2</span><span class="swatch l3">3</span><span class="swatch l4">4</span><span class="swatch l5">5</span><span>差异高</span></div>
  <section id="summary" class="panel summary"></section>
  <section class="panel viewer"><div id="status" class="status"></div><div id="stream" class="stream"></div><p id="detail" class="detail">悬停 Token 查看 Top-16 KL 与实际采样 Token 差异。</p></section>
  <script type="application/octet-stream" id="payload">__PAYLOAD_B64__</script>
  <script>
  (()=>{const $=id=>document.getElementById(id);let data;const labels={top16kl:'Student Top-16 KL(S‖T)',k1:'采样 Token K1',k3:'采样 Token K3',overlap:'Top-16 overlap'};function fmt(v,d=6){return Number(v).toFixed(d)}function pct(v){return fmt(v*100,1)+'%'}function display(v){return v===''?'∅':v.replace(/\t/g,'⇥').replace(/\n/g,'↵\n')}function selected(){return data.cases[Number($('case').value)]}function description(s,p,t){return `token ${p.toLocaleString()} · Student Top-16 KL(S‖T)=${fmt(s.top16kl[p])} · overlap=${pct(s.overlap[p])} · sample K1(log pS−log pT)=${fmt(s.k1[p])} · K3=${fmt(s.k3[p])} · log pS=${fmt(s.studentLogp[p])} · log pT=${fmt(s.teacherLogp[p])} · top1=${s.top1[p]?'同':'不同'} · ${JSON.stringify(t)}`}function fill(q=''){const old=$('case').value,n=q.trim().toLowerCase(),matches=data.cases.map((item,index)=>({item,index})).filter(({item})=>!n||`${item.index} ${item.problemId} ${item.topic} ${item.difficulty}`.toLowerCase().includes(n));$('case').replaceChildren();for(const {item,index} of matches){const o=document.createElement('option');o.value=index;o.textContent=`#${item.index} · d=${item.difficulty} · ${item.topic.split(' -> ').pop()}`;$('case').append(o)}$('case').disabled=!matches.length;if(!matches.length){const o=document.createElement('option');o.textContent='没有匹配题目';$('case').append(o);return false}if(matches.some(x=>String(x.index)===old))$('case').value=old;return true}function render(reset=false){const c=selected(),s=data.streams[String(c.index)],m=$('metric').value,slider=$('position'),size=data.windowSize;slider.max=Math.max(0,s.tokens.length-size);if(reset)slider.value=0;const start=Math.min(Number(slider.value),Math.max(0,s.tokens.length-1)),end=Math.min(s.tokens.length,start+size);$('window-label').textContent=`Token window ${start.toLocaleString()}–${Math.max(start,end-1).toLocaleString()} / ${(s.tokens.length-1).toLocaleString()}`;$('prev').disabled=start===0;$('next').disabled=end>=s.tokens.length;$('summary').innerHTML=`<div><strong>#${c.index}</strong> · difficulty ${c.difficulty} · ${c.topic.replace('Mathematics -> ','')}</div><div class="answer-grid"><div><span class="label">1.7B 错误答案 · ${c.studentTokens.toLocaleString()} tokens</span><p class="answer"></p></div><div><span class="label">14B 正确答案 · ${c.teacherTokens.toLocaleString()} tokens</span><p class="answer"></p></div></div>`;const ans=$('summary').querySelectorAll('.answer');ans[0].textContent=c.studentAnswer;ans[1].textContent=c.teacherAnswer;$('status').textContent=`${labels[m]} mean ${m==='overlap'?pct(c[m]):fmt(c[m])} · ${s.tokens.length.toLocaleString()} tokens`;const cap=data.caps[m],frag=document.createDocumentFragment();for(let p=start;p<end;p++){const value=s[m][p],mag=m==='k1'?Math.abs(value):m==='overlap'?1-value:Math.max(0,value),intensity=Math.min(1,Math.log1p(mag)/Math.log1p(m==='overlap'?1:cap)),level=Math.min(5,Math.floor(intensity*5)+1),mark=document.createElement('span');mark.className=`token l${level}`+(m==='k1'&&value<0?' neg':'');mark.textContent=display(s.tokens[p]);mark.dataset.position=p;mark.title=description(s,p,s.tokens[p]);frag.append(mark)}$('stream').replaceChildren(frag);$('detail').textContent='悬停 Token 查看 Student Top-16 KL、overlap，以及实际采样 Token 在两模型下的 log-probability。'}function show(e){const mark=e.target.closest('.token');if(!mark)return;const c=selected(),s=data.streams[String(c.index)],p=Number(mark.dataset.position);$('detail').textContent=description(s,p,s.tokens[p])}async function load(){const binary=atob($('payload').textContent.replace(/\s/g,'')),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0)),stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));data=JSON.parse(await new Response(stream).text());fill();$('case').addEventListener('change',()=>render(true));$('search').addEventListener('input',e=>{if(fill(e.target.value))render(true)});$('metric').addEventListener('change',()=>render());$('position').addEventListener('input',()=>render());$('prev').addEventListener('click',()=>{$('position').value=Math.max(0,Number($('position').value)-data.windowSize);render()});$('next').addEventListener('click',()=>{$('position').value=Math.min(Number($('position').max),Number($('position').value)+data.windowSize);render()});$('stream').addEventListener('pointerover',show);$('stream').addEventListener('click',show);render(true)}load().catch(e=>$('detail').textContent=`载入失败：${e.message}`)})();
  </script>
</main></body></html>
